<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#1c7ed6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="468" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>

  <text x="25" y="32" fill="#212529" font-size="16" font-weight="bold">Diagrama de cuerpo libre del brazo</text>
  <line x1="25" y1="44" x2="655" y2="44" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- apoyo fijo -->
  <path d="M250,300 L222,338 L278,338 Z" fill="#e9ecef" stroke="#495057" stroke-width="1.6"/>
  <g stroke="#adb5bd" stroke-width="1.5">
    <line x1="230" y1="338" x2="220" y2="348"/>
    <line x1="246" y1="338" x2="236" y2="348"/>
    <line x1="262" y1="338" x2="252" y2="348"/>
    <line x1="278" y1="338" x2="268" y2="348"/>
  </g>

  <!-- referencia horizontal -->
  <line x1="250" y1="300" x2="500" y2="300" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- brazo -->
  <line x1="250" y1="300" x2="423" y2="200" stroke="#343a40" stroke-width="9" stroke-linecap="round"/>

  <!-- angulo -->
  <path d="M325,300 A75,75 0 0 0 315,262.5" fill="none" stroke="#1c7ed6" stroke-width="1.8"/>
  <text x="320" y="322" fill="#1c7ed6" font-size="15" font-style="italic">&#952;</text>

  <!-- pivote -->
  <circle cx="250" cy="300" r="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="3.5"/>
  <circle cx="250" cy="300" r="2.5" fill="#1c7ed6"/>

  <!-- reacciones -->
  <line x1="250" y1="300" x2="180" y2="300" stroke="#1c7ed6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="172" y="294" fill="#1c7ed6" font-size="14" font-style="italic" text-anchor="end">R<tspan font-size="10" dy="3">x</tspan></text>

  <line x1="250" y1="300" x2="250" y2="225" stroke="#1c7ed6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="258" y="220" fill="#1c7ed6" font-size="14" font-style="italic">R<tspan font-size="10" dy="3">y</tspan></text>

  <!-- peso en el centro de masa -->
  <circle cx="336.6" cy="250" r="4.5" fill="#2b8a3e"/>
  <line x1="336.6" y1="250" x2="336.6" y2="345" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="346" y="340" fill="#2b8a3e" font-size="14" font-style="italic">m g</text>
  <text x="318" y="238" fill="#2b8a3e" font-size="11" text-anchor="end">CM</text>

  <!-- empuje -->
  <line x1="423" y1="200" x2="375.5" y2="117.7" stroke="#e8590c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="367" y="112" fill="#e8590c" font-size="15" font-style="italic" text-anchor="end">F</text>
  <text x="370" y="128" fill="#e8590c" font-size="11" text-anchor="end">empuje</text>
</svg>
