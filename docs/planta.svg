<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="468" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>

  <text x="25" y="32" fill="#212529" font-size="16" font-weight="bold">Planta: aeropéndulo (brazo con motor-hélice en el extremo)</text>
  <line x1="25" y1="44" x2="655" y2="44" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- base -->
  <rect x="175" y="400" width="230" height="16" rx="3" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5"/>
  <g stroke="#adb5bd" stroke-width="1.5">
    <line x1="190" y1="416" x2="180" y2="426"/>
    <line x1="212" y1="416" x2="202" y2="426"/>
    <line x1="234" y1="416" x2="224" y2="426"/>
    <line x1="256" y1="416" x2="246" y2="426"/>
    <line x1="278" y1="416" x2="268" y2="426"/>
    <line x1="300" y1="416" x2="290" y2="426"/>
    <line x1="322" y1="416" x2="312" y2="426"/>
    <line x1="344" y1="416" x2="334" y2="426"/>
    <line x1="366" y1="416" x2="356" y2="426"/>
    <line x1="388" y1="416" x2="378" y2="426"/>
  </g>
  <text x="215" y="446" fill="#495057" font-size="12">base</text>

  <!-- columna -->
  <path d="M205,400 L250,234 L320,234 L365,400 Z" fill="#f1f3f5" stroke="#495057" stroke-width="1.8"/>
  <line x1="368" y1="336" x2="350" y2="336" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="372" y="340" fill="#495057" font-size="12">columna</text>

  <!-- referencia horizontal -->
  <line x1="285" y1="234" x2="470" y2="234" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- brazo -->
  <line x1="285" y1="234" x2="433" y2="141" stroke="#343a40" stroke-width="9" stroke-linecap="round"/>

  <!-- angulo -->
  <path d="M340,234 A55,55 0 0 0 331.6,204.9" fill="none" stroke="#1c7ed6" stroke-width="1.8"/>
  <text x="345" y="222" fill="#1c7ed6" font-size="15" font-style="italic">&#952;</text>

  <!-- cota L -->
  <g stroke="#868e96" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="273" y1="215" x2="421" y2="122"/>
  </g>
  <g stroke="#868e96" stroke-width="1.4">
    <line x1="268" y1="221" x2="278" y2="209"/>
    <line x1="416" y1="128" x2="426" y2="116"/>
  </g>
  <text x="330" y="158" fill="#868e96" font-size="15" font-style="italic">L</text>

  <!-- pivote -->
  <circle cx="285" cy="234" r="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="3.5"/>
  <circle cx="285" cy="234" r="2.5" fill="#1c7ed6"/>
  <line x1="205" y1="210" x2="277" y2="231" stroke="#1c7ed6" stroke-width="1.1"/>
  <text x="150" y="205" fill="#1c7ed6" font-size="12">pivote</text>

  <!-- motor -->
  <g transform="rotate(-32, 443.6, 134.9)">
    <rect x="421.6" y="118.9" width="44" height="32" rx="4" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
    <line x1="430" y1="134.9" x2="457" y2="134.9" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
  <line x1="468" y1="170" x2="452" y2="145" stroke="#e8590c" stroke-width="1.1"/>
  <text x="472" y="176" fill="#e8590c" font-size="12">motor DC</text>

  <!-- helice -->
  <g transform="rotate(-32, 469, 119)">
    <ellipse cx="469" cy="119" rx="5" ry="30" fill="#ffa94d" fill-opacity="0.85" stroke="#e8590c" stroke-width="1.5"/>
  </g>
  <circle cx="469" cy="119" r="4" fill="#e8590c"/>
  <line x1="490" y1="106" x2="477" y2="112" stroke="#e8590c" stroke-width="1.1"/>
  <text x="494" y="103" fill="#e8590c" font-size="12">hélice</text>

  <!-- empuje -->
  <line x1="469" y1="119" x2="437" y2="68" stroke="#e8590c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="452" y="62" fill="#e8590c" font-size="15" font-style="italic">F</text>
  <text x="468" y="62" fill="#e8590c" font-size="11">empuje</text>
</svg>
